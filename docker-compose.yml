services:
  postgres:
    image: postgres:16-alpine
    container_name: gamesales-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: gamesales
      POSTGRES_PASSWORD: gamesales
      POSTGRES_DB: gamesales
    ports:
      - '5433:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: gamesales-redis
    restart: unless-stopped
    ports:
      - '6380:6379'

volumes:
  postgres_data:
